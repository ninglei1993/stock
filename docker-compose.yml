services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: themeradar
      POSTGRES_PASSWORD: themeradar
      POSTGRES_DB: themeradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U themeradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://themeradar:themeradar@postgres:5432/themeradar
      DATABASE_URL_SYNC: postgresql://themeradar:themeradar@postgres:5432/themeradar
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      JQDATA_USERNAME: ${JQDATA_USERNAME:-}
      JQDATA_PASSWORD: ${JQDATA_PASSWORD:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_API_URL: ${TUSHARE_API_URL:-http://teajoin.com}
      DEMO_MODE: ${DEMO_MODE:-true}
      INGEST_MAX_CONCEPTS: ${INGEST_MAX_CONCEPTS:-50}
      INGEST_CONCEPT_FILTER: ${INGEST_CONCEPT_FILTER:-}
      INGEST_MAX_STOCKS_PER_CONCEPT: ${INGEST_MAX_STOCKS_PER_CONCEPT:-0}
      SCAN_VOLATILE_STORAGE: ${SCAN_VOLATILE_STORAGE:-false}
      JQDATA_DATA_START: ${JQDATA_DATA_START:-2025-02-06}
      JQDATA_DATA_END: ${JQDATA_DATA_END:-2026-02-13}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
