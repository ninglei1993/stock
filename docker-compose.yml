services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-auto}
      JQDATA_USERNAME: ${JQDATA_USERNAME:-}
      JQDATA_PASSWORD: ${JQDATA_PASSWORD:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_API_URL: ${TUSHARE_API_URL:-http://teajoin.com}
      DEMO_MODE: ${DEMO_MODE:-true}
      INGEST_MAX_CONCEPTS: ${INGEST_MAX_CONCEPTS:-50}
      INGEST_CONCEPT_FILTER: ${INGEST_CONCEPT_FILTER:-}
      INGEST_MAX_STOCKS_PER_CONCEPT: ${INGEST_MAX_STOCKS_PER_CONCEPT:-0}
      DATA_DIR: /data
      MARKET_CACHE_ENABLED: ${MARKET_CACHE_ENABLED:-true}
      JQDATA_DATA_START: ${JQDATA_DATA_START:-2025-02-06}
      JQDATA_DATA_END: ${JQDATA_DATA_END:-2026-02-13}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)\" >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 6
      start_period: 15s
    volumes:
      - ./backend:/app
      - ./data:/data

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
